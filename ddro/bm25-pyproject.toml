[project]
name = "bm25-pyserini"
version = "0.1.0"
description = "BM25 retrieval with Pyserini"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {text = "MIT"}

dependencies = [
    # Core dependencies
    "numpy-base==1.24.3",
    "numpy<2.0.0",
    "scipy>=1.10.1",
    "pandas>=2.2.3",
    "scikit-learn>=1.5.2",
    
    # PyTorch
    "torch>=2.0.1",
    
    # Information Retrieval
    "pyserini>=0.39.0",
    "faiss-gpu>=1.7.4",
    "nmslib>=2.1.1",
    "lightgbm>=4.5.0",
    
    # NLP Libraries
    "spacy>=3.8.2",
    "spacy-legacy>=3.0.12",
    "spacy-loggers>=1.0.5",
    "transformers>=4.45.2",
    "tokenizers>=0.20.1",
    "sentencepiece>=0.2.0",
    "tiktoken>=0.8.0",
    
    # Hugging Face
    "huggingface-hub>=0.26.1",
    "safetensors>=0.4.5",
    
    # OpenAI
    "openai>=1.52.1",
    
    # Utils
    "click>=8.1.7",
    "tqdm>=4.66.5",
    "rich>=13.9.3",
    "coloredlogs>=15.0.1",
    "humanfriendly>=10.0",
    "typer>=0.12.5",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "urllib3>=2.2.3",
    "certifi>=2024.8.30",
    
    # Data handling
    "pyarrow>=17.0.0",
    "fsspec>=2024.10.0",
    "smart-open>=7.0.5",
    "cloudpathlib>=0.20.0",
    
    # System utilities
    "psutil>=6.0.0",
    "filelock>=3.16.1",
    "packaging>=24.1",
    "platformdirs>=3.10.0",
    "pooch>=1.7.0",
    
    # Validation
    "pydantic>=2.9.2",
    "pydantic-core>=2.23.4",
    "annotated-types>=0.7.0",
    
    # Java integration
    "pyjnius>=1.6.1",
    
    # Language processing
    "langcodes>=3.4.1",
    "language-data>=1.2.0",
    "regex>=2024.9.11",
    
    # Text processing
    "markdown-it-py>=3.0.0",
    "mdurl>=0.1.2",
    "pygments>=2.18.0",
    
    # Spacy components
    "blis>=1.0.1",
    "catalogue>=2.0.10",
    "confection>=0.1.5",
    "cymem>=2.0.8",
    "murmurhash>=1.0.10",
    "preshed>=3.0.9",
    "srsly>=2.4.8",
    "thinc>=8.3.2",
    "wasabi>=1.1.3",
    "weasel>=0.4.1",
    
    # Data structures
    "marisa-trie>=1.2.1",
    
    # Date utilities
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "tzdata>=2024.2",
    
    # Async/HTTP
    "anyio>=4.6.2",
    "h11>=0.14.0",
    "httpcore>=1.0.6",
    "httpx>=0.27.2",
    "sniffio>=1.3.1",
    
    # Parsing/JSON
    "jiter>=0.6.1",
    "charset-normalizer>=3.4.0",
    "idna>=3.10",
    
    # ML/DL utilities
    "onnxruntime>=1.19.2",
    "protobuf>=5.28.3",
    "flatbuffers>=24.3.25",
    "sympy>=1.13.3",
    
    # Parallel processing
    "joblib>=1.4.2",
    "threadpoolctl>=3.5.0",
    
    # Build tools
    "cython>=3.0.11",
    "setuptools>=75.1.0",
    "wheel>=0.44.0",
    
    # Utilities
    "wrapt>=1.16.0",
    "distro>=1.9.0",
    "shellingham>=1.5.4",
    "markupsafe>=3.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[tool.setuptools]
packages = ["bm25_pyserini"]

[tool.setuptools.package-data]
bm25_pyserini = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
